<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat & Earn</title>
<style>
body{font-family:system-ui;background:#0f172a;color:white;margin:0;padding:10px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin:10px 0}
#chat{height:320px;overflow-y:auto;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px}
.msg{margin:6px 0;padding:8px 12px;background:#334155;border-radius:8px}
button{background:#22c55e;color:white;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%;margin-top:8px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;box-sizing:border-box}
.wallet{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="card wallet">
<div><b>Points: <span id="pts">0</span></b><br><small>KSh <span id="kes">0.00</span></small></div>
<button style="width:auto" onclick="withdraw()">Withdraw M-Pesa</button>
</div>
<div class="card">
<div id="chat"><div class="msg">System: Welcome! Type to earn 1 point per message.</div></div>
<br>
<input id="input" placeholder="Type message to earn...">
<button onclick="send()">Send & Earn +1</button>
</div>
<script>
let pts=parseInt(localStorage.getItem('pts')||0);
function update(){document.getElementById('pts').innerText=pts;document.getElementById('kes').innerText=(pts*0.5).toFixed(2);localStorage.setItem('pts',pts)}
update();
function send(){
 let v=document.getElementById('input').value.trim();
 if(v.length<3)return alert('Type longer message');
 let c=document.getElementById('chat');
 c.innerHTML+=`<div class="msg">You: ${v} <small style="color:#22c55e">+1</small></div>`;
 document.getElementById('input').value='';
 pts++;update();c.scrollTop=c.scrollHeight;
}
function withdraw(){alert('M-Pesa Request: KSh '+document.getElementById('kes').innerText+'\nNext: Connect Daraja API');}
</script>
</body>
</html>
