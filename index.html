<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat & Earn Zambia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;min-height:100vh}
.container{max-width:400px;margin:0 auto;padding:20px}
.header{text-align:center;padding:20px 0}
.header h1{color:#fbbf24;font-size:28px}
.header p{color:#94a3b8;font-size:14px;margin-top:5px}
.card{background:#1e293b;border-radius:16px;padding:20px;margin:15px 0;border:1px solid #334155}
.label{font-size:12px;color:#94a3b8;margin:12px 0 5px 0;display:block}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;font-size:16px;margin-top:15px;cursor:pointer}
.btn-yellow{background:#eab308;color:black}
.btn-blue{background:#3b82f6;color:white}
.chatbox{background:#1e293b;height:300px;overflow-y:auto;border-radius:12px;padding:10px;margin:10px 0;border:1px solid #334155}
.msg{background:#334155;padding:10px 12px;border-radius:12px;margin:8px 0;max-width:80%}
.msg.me{background:#eab308;color:black;margin-left:auto}
.balance{font-size:32px;color:#fbbf24;text-align:center;font-weight:bold}
.task{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:12px;border-radius:10px;margin:8px 0}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin:15px 0}
.tab{flex:1;padding:10px;background:#1e293b;border:1px solid #334155;color:white;border-radius:10px;text-align:center}
.tab.active{background:#eab308;color:black;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>💬 Chat & Earn Zambia</h1>
<p>Chat, Complete Tasks & Earn Kwacha!</p>
</div>
<div id="regPage" class="card">
<h3 style="text-align:center">Create Account</h3>
<label class="label">Full Name</label>
<input id="name" class="input" placeholder="e.g. John Banda">
<label class="label">Phone Number</label>
<input id="phone" class="input" placeholder="e.g. 0977 123456">
<label class="label">Password</label>
<input id="pass" type="password" class="input" placeholder="Create password">
<button class="btn btn-yellow" onclick="register()">Register & Start Earning</button>
<p style="text-align:center;margin-top:10px;font-size:13px">Already have account? <span style="color:#fbbf24" onclick="showLogin()">Login</span></p>
</div>
<div id="loginPage" class="card hidden">
<h3 style="text-align:center">Welcome Back</h3>
<label class="label">Phone Number</label>
<input id="loginPhone" class="input" placeholder="0977 123456">
<label class="label">Password</label>
<input id="loginPass" type="password" class="input" placeholder="Password">
<button class="btn btn-yellow" onclick="login()">Login</button>
